workflows:
  ios-ipa-unsigned:
    name: Compilar NutriTrack IPA
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Preparar proyecto Capacitor iOS
        script: |
          mkdir -p www
          cp index.html www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "NutriTrack PRO" "com.alex.nutritrack" --web-dir www
          npx cap add ios
          npx cap copy ios
      - name: Compilar con Xcode sin firma para Sideloadly
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build
      - name: Empaquetar archivo .ipa
        script: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r NutriTrack-iOS.ipa Payload
    artifacts:
      - NutriTrack-iOS.ipa
